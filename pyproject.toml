[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["geOrchestra", "geOrchestra.console", "geOrchestra.meta_apis"]
include-package-data = false


[project]
name = "geOrchestra"
version = "0.1.3"
authors = [
  { name="Jean-Michel Crepel", email="jeanmi151@protonmail.com" },
]
description = "A collection of geospatial utility scripts"
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
# List ONLY easy-to-install libraries here
dependencies = [
    "requests",
    "python-dotenv",
    "geoservercloud",
]

[project.urls]
Homepage = "https://github.com/georchestra/geo-utils"
Repository = "https://github.com/georchestra/geo-utils"
Issues = "https://github.com/georchestra/geo-utils/issues"
